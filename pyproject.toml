[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playbooks-extractor"
version = "0.1.0"
description = "Containerised web app to extract purchased Google Play Books audiobooks and accompanying PDFs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "httpx>=0.27.2",
    "playwright>=1.49.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
playbooks-extractor = "playbooks_extractor.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
